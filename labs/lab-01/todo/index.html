<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>To-do list</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20243a; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 18px; }
    main { width: min(100%, 560px); margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.04em; }
    .intro { margin: 8px 0 26px; color: #60677d; }
    .card { padding: 24px; border: 1px solid #e3e6ef; border-radius: 18px; background: #fff; box-shadow: 0 12px 35px #26304a12; }
    form { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid #cbd0de; border-radius: 10px; font: inherit; }
    input:focus { outline: 3px solid #c9d4ff; border-color: #536dfe; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #4358e8; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #3045cf; }
    button:focus-visible { outline: 3px solid #20243a; outline-offset: 3px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 12px; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter { padding: 7px 10px; background: transparent; color: #545b70; font-size: .9rem; }
    .filter:hover, .filter[aria-pressed="true"] { background: #edf0ff; color: #3045cf; }
    #clear-completed { padding: 7px 0; background: none; color: #60677d; font-size: .9rem; }
    #clear-completed:hover { background: none; color: #b42335; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 14px 2px; border-bottom: 1px solid #edf0f5; }
    li:last-child { border-bottom: 0; }
    li input[type="checkbox"] { width: 19px; height: 19px; margin: 0; accent-color: #4358e8; flex: 0 0 auto; }
    .task-text { flex: 1; overflow-wrap: anywhere; }
    li.completed .task-text { color: #81879a; text-decoration: line-through; }
    .delete { padding: 6px 9px; background: transparent; color: #73798b; font-size: .9rem; }
    .delete:hover { background: #fff0f1; color: #b42335; }
    .empty { margin: 24px 0 6px; text-align: center; color: #747b8f; }
    .status { min-height: 1.3em; margin: 14px 0 0; color: #60677d; font-size: .9rem; }
    @media (max-width: 420px) { body { padding: 28px 14px; } .card { padding: 18px; } form { flex-direction: column; } form button { width: 100%; } .toolbar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>My to-do list</h1>
    <p class="intro">One step at a time. Your list is saved on this device.</p>
    <section class="card" aria-label="To-do list">
      <form id="todo-form">
        <label for="task-input" class="visually-hidden" hidden>Add a task</label>
        <input id="task-input" name="task" type="text" maxlength="160" placeholder="What needs to get done?" autocomplete="off" required>
        <button type="submit">Add task</button>
      </form>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button id="clear-completed" type="button">Clear completed</button>
      </div>
      <ul id="todo-list" aria-label="Tasks"></ul>
      <p id="empty-message" class="empty">No tasks here yet. Add one above!</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    (() => {
      const STORAGE_KEY = "lab-01-todos";
      const form = document.querySelector("#todo-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#todo-list");
      const emptyMessage = document.querySelector("#empty-message");
      const status = document.querySelector("#status");
      const filters = [...document.querySelectorAll("[data-filter]")];
      let activeFilter = "all";
      let todos = [];

      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(saved)) todos = saved.filter(item => item && typeof item.id === "string" && typeof item.text === "string" && typeof item.completed === "boolean");
      } catch {
        todos = [];
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch {
          status.textContent = "Couldn't save changes in this browser.";
        }
      }

      function render() {
        list.replaceChildren();
        const visibleTodos = todos.filter(todo => activeFilter === "all" || (activeFilter === "active" && !todo.completed) || (activeFilter === "completed" && todo.completed));
        for (const todo of visibleTodos) {
          const item = document.createElement("li");
          if (todo.completed) item.classList.add("completed");

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.setAttribute("aria-label", `${todo.completed ? "Mark incomplete" : "Mark complete"}: ${todo.text}`);
          checkbox.addEventListener("change", () => {
            todo.completed = checkbox.checked;
            save();
            render();
            status.textContent = todo.completed ? "Task completed." : "Task marked active.";
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = todo.text;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete";
          remove.textContent = "Delete";
          remove.setAttribute("aria-label", `Delete: ${todo.text}`);
          remove.addEventListener("click", () => {
            todos = todos.filter(entry => entry.id !== todo.id);
            save();
            render();
            status.textContent = "Task deleted.";
          });

          item.append(checkbox, text, remove);
          list.append(item);
        }
        emptyMessage.hidden = visibleTodos.length !== 0;
        if (visibleTodos.length === 0 && todos.length > 0) {
          emptyMessage.textContent = activeFilter === "active" ? "All tasks are complete!" : "No completed tasks yet.";
        } else {
          emptyMessage.textContent = "No tasks here yet. Add one above!";
        }
        const remaining = todos.filter(todo => !todo.completed).length;
        document.querySelector(".intro").textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left. Your list is saved on this device.`;
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        todos.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, text, completed: false });
        save();
        activeFilter = "all";
        filters.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));
        render();
        input.value = "";
        input.focus();
        status.textContent = "Task added.";
      });

      filters.forEach(button => button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filters.forEach(filter => filter.setAttribute("aria-pressed", String(filter === button)));
        render();
      }));

      document.querySelector("#clear-completed").addEventListener("click", () => {
        const before = todos.length;
        todos = todos.filter(todo => !todo.completed);
        if (todos.length !== before) {
          save();
          render();
          status.textContent = "Completed tasks cleared.";
        } else {
          status.textContent = "There are no completed tasks to clear.";
        }
      });

      render();
    })();
  </script>
</body>
</html>
